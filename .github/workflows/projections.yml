name: projections

on:
  schedule:
    - cron: '30 11 * * 2'
    - cron: '30 15 * * 2'
  push:
    branches: [main]
    paths:
      - projections/starters.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: projections
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: |
            projections/requirements.txt
            projections/requirements-dev.txt

      - name: Install dependencies
        run: |
          python3 -m pip install -r projections/requirements.txt -r projections/requirements-dev.txt

      - name: Test
        run: python3 -m pytest tests/projections -q

      - name: Build projections
        run: |
          python3 -m projections.run --season 2026 \
            --out frontend/public/data/projections.json \
            --snapshots projections/snapshots \
            --starters projections/starters.json \
            --data-dir "$RUNNER_TEMP/nfl-data"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/projections.json projections/snapshots/
          if git diff --cached --quiet; then
            echo "No projection changes to commit."
            exit 0
          fi
          git commit -m "chore: update projections through latest data"
          for attempt in 1 2; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying."
          done
          exit 1
