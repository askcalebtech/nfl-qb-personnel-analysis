name: projections

on:
  schedule:
    - cron: '30 11 * * 2'
    - cron: '30 15 * * 2'
  push:
    branches: [main]
    paths:
      - projections/starters.json
      - projections/starter_corrections.json
  workflow_dispatch:

# Covers both jobs, so a build and its publish finish before the next run starts.
concurrency:
  group: projections
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs third-party Python with a read-only token and no stored git credentials.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: |
            projections/requirements.txt
            projections/requirements-dev.txt

      - name: Install dependencies
        run: |
          python3 -m pip install -r projections/requirements.txt -r projections/requirements-dev.txt

      - name: Test
        run: python3 -m pytest tests/projections -q

      - name: Build projections
        run: |
          python3 -m projections.run --season 2026 \
            --out frontend/public/data/projections.json \
            --snapshots projections/snapshots \
            --starters projections/starters.json \
            --corrections projections/starter_corrections.json \
            --data-dir "$RUNNER_TEMP/nfl-data"

      # One tar file keeps the directory layout intact (upload-artifact strips the least common
      # ancestor of multiple paths) and always exists, even when nothing changed.
      - name: Package outputs
        run: |
          tar -cf "$RUNNER_TEMP/projections-output.tar" \
            frontend/public/data/projections.json projections/snapshots

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: projections-output
          path: ${{ runner.temp }}/projections-output.tar
          if-no-files-found: error
          retention-days: 7

  # Holds the write token. Installs and runs no third-party Python.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: projections-output
          path: ${{ runner.temp }}/artifact

      - name: Unpack outputs
        run: |
          tar_file="$RUNNER_TEMP/artifact/projections-output.tar"
          # Only regular files and directories, only the two expected paths.
          if tar -tvf "$tar_file" | grep -v '^[-d]'; then
            echo "Unexpected member type in artifact." >&2
            exit 1
          fi
          if tar -tf "$tar_file" | grep -Ev '^(frontend/public/data/projections\.json|projections/snapshots(/[A-Za-z0-9._-]+)?/?)$'; then
            echo "Unexpected path in artifact." >&2
            exit 1
          fi
          tar -xf "$tar_file"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/projections.json projections/snapshots/
          if git diff --cached --quiet; then
            echo "No projection changes to commit."
            exit 0
          fi
          git commit -m "chore: update projections through latest data"
          for attempt in 1 2; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            git rebase --abort 2>/dev/null || true
          done
          exit 1
